        .btn-gold:hover { background:var(--accent-gold); color:var(--bg-dark); transform:translateY(-2px); }

        .hero-view { height:calc(100vh - 200px); display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
        .hero-view h1 { font-family:'Cinzel',serif; font-size:4.5rem; letter-spacing:15px; margin-bottom:25px; font-weight:400; }
        .hero-view p { color:var(--text-muted); letter-spacing:8px; text-transform:uppercase; font-size:.95rem; margin-bottom:40px; }

        .story-layout { display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; padding-top:40px; }
        .story-img { width:100%; height:550px; background:url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?q=80&w=1200') center/cover; border:1px solid var(--border-color); }

        .menu-header p { color:var(--text-muted); letter-spacing:4px; font-size:.85rem; text-transform:uppercase; }

        .tab-btn { background:transparent; border:none; color:var(--text-muted); font-size:.85rem; letter-spacing:2px; cursor:pointer; padding:8px 16px; transition:all .3s; font-family:inherit; text-transform:uppercase; }

        .category-tag { display:inline-block; font-size:.65rem; letter-spacing:2px; text-transform:uppercase; padding:3px 8px; border:1px solid var(--border-color); color:var(--text-muted); margin-bottom:12px; }

            .story-layout{grid-template-columns:1fr;gap:40px}
            header{padding:20px 5%}

const catNames = {single:'手冲单品',espresso:'意式经典',creative:'特调冷萃',tea:'东方茶饮',bakery:'手作烘焙'};

function switchPage(pageId){
    const active=document.querySelector('.page-container.active');
    if(active){active.style.opacity='0';active.style.transform='translateY(-15px)';}
    setTimeout(()=>{
        document.querySelectorAll('.page-container').forEach(p=>p.classList.remove('active'));
        document.querySelectorAll('header nav a').forEach(a=>a.classList.remove('active'));
        const t=document.getElementById(`page-${pageId}`);
        if(t){t.classList.add('active');t.offsetHeight;t.style.opacity='1';t.style.transform='translateY(0)';}
        const l=document.getElementById(`link-${pageId}`);
        if(l)l.classList.add('active');
        window.scrollTo(0,0);
    },250);
}

function renderMenu(items){
    const c=document.getElementById('menu-grid-container');
    c.innerHTML='';
    items.forEach(item=>{
        const card=document.createElement('div');
        card.className='product-card';
        card.innerHTML=`
            <div class="product-img-box">
                <img src="${item.img}" alt="${item.name}" loading="lazy">
            </div>
            <div class="product-info">
                <span class="category-tag">${catNames[item.category]||item.category}</span>
                <div class="product-title-row">
                    <h3>${item.name}</h3>
                    <span class="product-price">${item.price}</span>
                </div>
                <div class="product-en">${item.en}</div>
                <div class="product-desc">${item.desc}</div>
            </div>`;
        c.appendChild(card);
    });
}

function filterMenu(cat,e){
    document.querySelectorAll('.menu-tabs .tab-btn').forEach(b=>b.classList.remove('active'));
    if(e&&e.target)e.target.classList.add('active');
    renderMenu(cat==='all'?menuData:menuData.filter(i=>i.category===cat));
}

document.addEventListener('DOMContentLoaded',()=>{switchPage('home');renderMenu(menuData);});
